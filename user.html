<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog</title>
  <link rel="stylesheet" href="styles.css">
  <script src="index.js"></script>
  <script
      src="https://kit.fontawesome.com/2015aca0a7.js"
      crossorigin="anonymous"
    ></script>
</head>
<body>
  <section>
    <nav>
        <figure class="nav__logo">
          <i class="fa-solid fa-video"></i>
          <p class="nav__logo--name">CineScope</p>
        </figure>

        <ul class="nav__links">
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Home</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Catalog</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Contact</a
            >
          </li>
          <li class="nav__link">
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect-black" onclick="(toggleContrast(event))"
              ><i
                class="fa-solid fa-circle-half-stroke"
              ></i>
            </a>
          </li>
        </ul>
      </nav>
  </section>
</body>
</html>
