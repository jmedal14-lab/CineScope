<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineScope</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
    <script src="index.js" defer></script>
    <script
      src="https://kit.fontawesome.com/2015aca0a7.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="landing">
      <nav>
        <figure class="nav__logo">
          <i class="fa-solid fa-video"></i>
          <p class="nav__logo--name">CineScope</p>
        </figure>

        <ul class="nav__links">
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              aria-current="page"
              >Home</a
            >
          </li>
          <li class="nav__link">
            <a
              href="catalog.html"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Catalog</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black no-cursor"
              >Contact</a
            >
          </li>
          <li class="nav__link">
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect-black"
              onclick="toggleContrast(event)"
              ><i class="fa-solid fa-circle-half-stroke"></i>
            </a>
          </li>
        </ul>
        <div class="btns__wrapper">
          <button class="btn__menu" aria-label="Open menu" onclick="openMenu()">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="menu__backdrop">
            <button class="btn__menu btn__menu--close" onclick="closeMenu()" aria-label="Close menu">
              <i class="fa-solid fa-times"></i>
            </button>
            <ul class="menu__links">
              <li class="menu__list">
                <a
                  href="#"
                  class="menu__link link__hover-effect"
                  onclick="closeMenu()"
                  aria-current="page"
                  >Home</a
                >
              </li>
              <li class="menu__list">
                <a
                  href="catalog.html"
                  class="menu__link link__hover-effect"
                  onclick="closeMenu()"
                  >Catalog</a
                >
              </li>
              <li class="menu__list">
                <a
                  href="#"
                  class="menu__link link__hover-effect"
                  onclick="closeMenu()"
                  >Contact</a
                >
              </li>
            </ul>
          </div>
          <button class="btn__menu" onclick="toggleContrast(event)" aria-label="Dark Mode">
              <i class="fa-solid fa-circle-half-stroke btn__menu"></i>
            </button>
        </div>
      </nav>

      <header>
        <div class="header__container">
          <div class="header__description">
            <h1 class="header__description--title">
              The world's largest film library platform
            </h1>

            <h2 class="header__description--sub-title">
              Find your next watch with <span class="orange">CineScope</span>
            </h2>

            <div class="search__bar">
              <input id="search-input"
                type="text"
                placeholder="Search by Title or Keyword"
                style="padding: 10px; font-size: 16px; line-height: 1.5"
                class="header__search"
              />
              <button class="btn" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </div>
          </div>
          <figure class="header__img--wrapper">
            <img src="undraw_home-cinema_jdm1.svg" alt="" class="undraw" />
          </figure>
        </div>
      </header>
    </section>

    <footer>
      <div class="footer__container">
        <div class="footer__row">
          <figure>
            <i class="fa-solid fa-video footer__logo"></i>
          </figure>
          <div class="footer__links">
            <a
              href="#"
              class="footer__link link__hover-effect link__hover-effect--white no-cursor"
              >About Us</a
            >
            <a
              href="#"
              class="footer__link link__hover-effect link__hover-effect--white no-cursor"
              >FAQ</a
            >
            <a
              href="#"
              class="footer__link link__hover-effect link__hover-effect--white no-cursor"
              >Contact Support</a
            >
            <a
              href="#"
              class="footer__link link__hover-effect link__hover-effect--white no-cursor"
              >Terms of Use</a
            >
          </div>
        </div>
        <div class="footer__copyright">Copyright &copy; 2026 Jeanice Medal</div>
      </div>
    </footer>
  </body>
</html>
