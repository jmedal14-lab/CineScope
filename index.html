<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineScope</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
    <script
      src="https://kit.fontawesome.com/2015aca0a7.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="landing">
      <nav>
        <figure class="nav__logo">
          <i class="fa-solid fa-video"></i>
          <p class="nav__logo--name">CineScope</p>
        </figure>

        <ul class="nav__links">
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Home</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >All Movies</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Contact</a
            >
          </li>
          <li class="nav__link" onclick="toggleContrast()">
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect-black"
              ><i
                class="fa-solid fa-circle-half-stroke"
                style="color: #0b2545"
              ></i>
            </a>
          </li>
        </ul>
      </nav>
      <header>
        <div class="header__container">
          <div class="header__description">
            <h1 class="header__description--title">
              The world's largest movie library platform
            </h1>

            <h2 class="header__description--sub-title">
              Find your next watch with <span class="orange">CineScope</span>
            </h2>

            <div class="search__bar">
              <input
                type="text"
                placeholder="Search by Keyword, Genre, Cast"
                style="padding: 10px; font-size: 16px; line-height: 1.5"
                class="header__search"
              />
              <button class="btn">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </div>
          </div>
          <figure class="header__img--wrapper">
            <img src="undraw_home-cinema_jdm1.svg" alt="" class="undraw" />
          </figure>
        </div>
      </header>
    </section>
  </body>
</html>
