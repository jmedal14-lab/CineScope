<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
    <script src="catalog.js" defer></script>
    <script
      src="https://kit.fontawesome.com/2015aca0a7.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section>
      <nav>
        <figure class="nav__logo">
          <i class="fa-solid fa-video"></i>
          <p class="nav__logo--name">CineScope</p>
        </figure>

        <ul class="nav__links">
          <li class="nav__link">
            <a
              href="index.html"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Home</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              aria-current="page"
              >Catalog</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black no-cursor"
              >Contact</a
            >
          </li>
          <li class="nav__link">
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect-black"
              onclick="toggleContrast(event)"
              ><i class="fa-solid fa-circle-half-stroke"></i>
            </a>
          </li>
        </ul>
        <div class="btns__wrapper">
          <button class="btn__menu" aria-label="Open menu" onclick="openMenu()">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="menu__backdrop">
            <button class="btn__menu btn__menu--close" onclick="closeMenu()" aria-label="Close menu">
              <i class="fa-solid fa-times"></i>
            </button>
            <ul class="menu__links">
              <li class="menu__list">
                <a
                  href="index.html"
                  class="menu__link link__hover-effect"
                  onclick="closeMenu()"
                  >Home</a
                >
              </li>
              <li class="menu__list">
                <a
                  href="catalog.html"
                  class="menu__link link__hover-effect"
                  onclick="closeMenu()"
                  aria-current="page"
                  >Catalog</a
                >
              </li>
              <li class="menu__list">
                <a
                  href="#"
                  class="menu__link link__hover-effect"
                  onclick="closeMenu()"
                  >Contact</a
                >
              </li>
            </ul>
          </div>
          <button class="btn__menu" onclick="toggleContrast(event)" aria-label="Dark Mode">
              <i class="fa-solid fa-circle-half-stroke btn__menu"></i>
            </button>
        </div>
      </nav>
    </section>

    <main>
      <section>
        <div class="container catalog">
          <div class="row">
            <div class="movies__header">
              <h2 class="section__title">
                Browse our films
              </h2>
              <div class="search__input--wrapper">
                <input id="search-input"
                type="text" 
                placeholder="Search by Title or Keyword" 
                style="padding: 10px; font-size: 14px; line-height: 1.5" class="catalog__header--search">
                <button class="search__btn" aria-label="Search" type="button">
                <i class="fa-solid fa-magnifying-glass" style="color: #f28c28"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="search">
        <div class="container">
          <div class="row row__search">
            <div class="content__wrapper">
              <h1 id="search__results">Search results:</h1>
              <select id="filter">
                <option value="" disabled selected>Sort</option>
                <option value="A-Z">A-Z</option>
                <option value="MOST_RECENT">Most Recent</option>
                <option value="RATING">Rating, High to Low</option>
              </select>
              </div>
              <div class="movies"></div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer__container">
        <div class="footer__row">
          <figure>
            <i class="fa-solid fa-video footer__logo"></i>
          </figure>
          <div class="footer__links">
            <a href="#" class="footer__link link__hover-effect link__hover-effect--white no-cursor">About Us</a>
            <a href="#" class="footer__link link__hover-effect link__hover-effect--white no-cursor">FAQ</a>
            <a href="#" class="footer__link link__hover-effect link__hover-effect--white no-cursor">Contact Support</a>
            <a href="#" class="footer__link link__hover-effect link__hover-effect--white no-cursor">Terms of Use</a>
            </div>
        </div>
            <div class="footer__copyright">
              Copyright &copy; 2026 Jeanice Medal
            </div>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
